<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7A2E1F">
<title>金属熱処理 2級 1問1答</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<style>
:root{
 --bg:#f7f4f1;--card:#fff;--ink:#28201d;--muted:#766b66;--brand:#7a2e1f;--brand2:#c94c2f;
 --soft:#f7dfd6;--line:#e7dcd7;--ok:#24734a;--ng:#b3261e;--gold:#fff0c2;--shadow:0 8px 24px rgba(65,35,27,.08)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:920px;margin:auto;padding:14px 14px 90px}
header{background:linear-gradient(135deg,#7a2e1f,#c94c2f);color:#fff;border-radius:21px;padding:18px;box-shadow:0 12px 28px rgba(122,46,31,.20)}
header h1{font-size:23px;margin:0 0 5px} header p{font-size:13px;margin:0;opacity:.92}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:12px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25)}
.progress{height:8px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:#ffe0b2;width:0}
.section,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.filters{padding:12px;margin:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,button{font:inherit;color:var(--ink);background:#fff;border:1px solid #d8cac4;border-radius:12px;padding:11px 12px}
button{cursor:pointer;font-weight:750}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
button.soft{background:var(--soft)}
button.toggle-on{background:#def2e7;color:#17643d;border-color:#78b390;box-shadow:inset 0 0 0 1px rgba(36,115,74,.12)}
.actions{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{padding:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{padding:5px 8px;border-radius:99px;background:#f9e9e3;color:#6c2b20;font-size:12px;font-weight:700}
.tag.hot{background:#fff0c2;color:#7a5310}
.qtext{font-size:19px;line-height:1.68;font-weight:750;white-space:pre-wrap;margin:8px 0 14px}
.fig{display:block;max-width:100%;max-height:390px;margin:12px auto;border:1px solid var(--line);border-radius:12px;background:white}
.options{display:grid;gap:9px}.opt{width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start}
.mark{min-width:31px;width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f2ece9;font-weight:850}
.opt.correct{border:2px solid var(--ok);background:#ecf8f1}.opt.wrong{border:2px solid var(--ng);background:#fff0ef}.opt:disabled{color:inherit}
.result{display:none;margin-top:12px;padding:12px;border-radius:12px;font-weight:800}.result.ok{display:block;background:#e8f6ee;color:var(--ok)}.result.ng{display:block;background:#fff0ef;color:var(--ng)}
.details{display:none;margin-top:12px;padding:14px;border-radius:14px;background:#fbfaf9;border:1px solid var(--line)}.details.show{display:block}
.details h3{margin:0 0 6px;font-size:14px;color:#7a2e1f}.details p{margin:0 0 13px;line-height:1.68;white-space:pre-wrap}
.navline{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:14px}
.small{font-size:12px;color:var(--muted);line-height:1.6}.empty{text-align:center;padding:34px 8px;color:var(--muted)}
.list{display:grid;gap:8px}.listItem{padding:12px;border:1px solid var(--line);border-radius:14px}.listItem h4{margin:0 0 5px}
.bottom{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 22px rgba(60,35,25,.08)}
.navbtn{border:none;background:white;padding:8px 5px;border-radius:13px;color:#665953}.navbtn.active{background:#fae8e1;color:#7a2e1f}.navbtn .ico{display:block;font-size:19px;margin-bottom:3px}
.hidden{display:none!important}
.install{display:none;margin-top:12px}.install.show{display:block}.install .section{padding:12px;background:#fff8df;border-color:#ead58d}
@media(min-width:720px){.filters{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header>
 <h1>🔥 金属熱処理 2級 1問1答</h1>
 <p>一般熱処理作業｜令和5・6・7年度 過去問トレーニング</p>
 <div class="stats">
   <span class="pill">収録 150問</span>
   <span class="pill" id="poolStat">出題候補 150問</span>
   <span class="pill" id="scoreStat">正解 0 / 0</span>
   <span class="pill" id="rateStat">正答率 --%</span>
 </div>
 <div class="progress"><div id="bar"></div></div>
</header>

<div id="installBanner" class="install">
 <div class="section">
  <strong>📲 ホーム画面に追加できます</strong>
  <div class="small" style="margin-top:6px">iPhone：Safariの共有 →「ホーム画面に追加」／ Android：Chromeの「アプリをインストール」</div>
  <div style="margin-top:8px;display:flex;gap:7px"><button id="installBtn" class="primary">インストール</button><button id="hideInstall">あとで</button></div>
 </div>
</div>

<div id="homeView">
 <div class="filters section">
  <select id="grade"><option>2級</option></select>
  <select id="year"><option value="">全年度</option></select>
  <select id="category"><option value="">全分野</option></select>
  <select id="theme"><option value="">全小テーマ</option></select>
 </div>
 <div class="actions section">
  <button id="randomBtn" class="soft" aria-pressed="false">🔀 ランダム OFF</button>
  <button id="startBtn" class="primary">▶ 出題スタート</button>
  <button id="wrongBtn">❌ 間違いだけ</button>
  <button id="resetBtn">↺ 成績リセット</button>
 </div>
 <div class="section" style="margin-top:12px;padding:14px">
   <strong>📚 3年間の出題傾向も反映</strong>
   <div class="small" style="margin-top:6px">問題ごとに「分野・小テーマ・頻出度」を表示。回答後に「講師用解説」と「覚える語句・意味」を確認できます。</div>
 </div>
</div>

<div id="quizView" class="hidden"><div id="quizCard" class="card"><div class="empty">ホームから出題を開始してください。</div></div></div>
<div id="wrongView" class="hidden"><div class="section" style="padding:14px"><h3 style="margin-top:0">❌ 間違えた問題</h3><div id="wrongList" class="list"></div></div></div>
<div id="statsView" class="hidden"><div class="section" style="padding:14px"><h3 style="margin-top:0">📊 学習状況</h3><div class="list">
<div class="listItem"><h4>全体成績</h4><div class="small" id="statsSummary"></div></div>
<div class="listItem"><h4>現在の出題条件</h4><div class="small" id="statsSettings"></div></div>
<div class="listItem"><h4>間違い問題</h4><div class="small" id="statsWrong"></div></div>
</div></div></div>
</div>

<nav class="bottom">
 <button class="navbtn active" data-view="homeView"><span class="ico">🏠</span>ホーム</button>
 <button class="navbtn" data-view="quizView"><span class="ico">📝</span>出題</button>
 <button class="navbtn" data-view="wrongView"><span class="ico">❌</span>間違い</button>
 <button class="navbtn" data-view="statsView"><span class="ico">📊</span>成績</button>
</nav>

<script>
const ALL=[{"grade": "2級", "year": "令和5年度", "qno": 1, "question": "鉄-炭素系平衡状態図において、A3線とAcm線との交点は、共析点である。", "questionImage": "", "choiceImage": "", "options": ["○", "×", "", ""], "answer": "○", "category": "金属組織・変態", "theme": "Fe-C系状態図・組織", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】○。記述は出題資料の正解表では正しい扱い。 Fe-C状態図は、炭素量が共析組成より左か右かを最初に判断させる。『亜共析＝初析フェライト』『過共析＝初析セメンタイト』『Fe₃C＝セメンタイト』を得点源にする。", "memory": "【Fe-C系】Fe₃C＝セメンタイト。パーライト＝フェライト＋セメンタイトの層状組織。共析組成は約0.77%C、A₁点は約727℃。亜共析鋼を徐冷→初析フェライト＋パーライト、過共析鋼を徐冷→初析セメンタイト＋パーライト。", "type": "tf"}, {"grade": "2級", "year": "令和5年度", "qno": 2, "question": "炭素含有率0.45%の機械構造用炭素鋼を900℃から徐冷すると、金属組織は、初析セメンタイトとパーライトになる。", "questionImage": "", "choiceImage": "", "options": ["○", "×", "", ""], "answer": "×", "category": "金属組織・変態", "theme": "Fe-C系状態図・組織", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】×。「パーライト」の定義・条件とのズレを見抜く問題。 Fe-C状態図は、炭素量が共析組成より左か右かを最初に判断させる。『亜共析＝初析フェライト』『過共析＝初析セメンタイト』『Fe₃C＝セメンタイト』を得点源にする。", "memory": "【Fe-C系】Fe₃C＝セメンタイト。パーライト＝フェライト＋セメンタイトの層状組織。共析組成は約0.77%C、A₁点は約727℃。亜共析鋼を徐冷→初析フェライト＋パーライト、過共析鋼を徐冷→初析セメンタイト＋パーライト。", "type": "tf"}, {"grade": "2級", "year": "令和5年度", "qno": 3, "question": "等温変態曲線とは、オーステナイトの等温変態の開始及び終了を、縦軸に温度、横軸 に時間をとって図示したものである。", "questionImage": "", "choiceImage": "", "options": ["○", "×", "", ""], "answer": "○", "category": "金属組織・変態", "theme": "TTT/CCT・変態点", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】○。記述は出題資料の正解表では正しい扱い。 Ac/Ar、Ms/Mf、TTT/CCTを混同しやすいので、加熱/冷却/等温/連続冷却の4軸で整理する。Msは開始、Mfは終了と必ず対にして覚えさせる。", "memory": "【変態点・曲線】TTT＝等温変態曲線（一定温度で保持した変態）、CCT＝連続冷却変態曲線。Acは加熱時、Arは冷却時。Ac₁＝オーステナイト生成開始、Ac₃＝亜共析鋼のオーステナイト化完了。Ms＝マルテンサイト変態開始、Mf＝終了。", "type": "tf"}, {"grade": "2級", "year": "令和5年度", "qno": 4, "question": "同一鋼種においては、オーステナイト結晶粒が小さいものほど、焼入性が良い。", "questionImage": "", "choiceImage": "", "options": ["○", "×", "", ""], "answer": "×", "category": "金属組織・変態", "theme": "焼入性・質量効果", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】×。「焼入性」の定義・条件とのズレを見抜く問題。 『焼入性＝ 態", "theme": "焼入性・質量効果", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】ウ。 正答選択肢は「S35Cは、SCM435より質量効果が小さい。」。 『焼入性＝硬さの高さ』という誤解を最初に外す。鋼種・結晶粒・合金元素と、断面寸法による質量効果を関連づけて説明する。", "memory": "【焼入性】『どこまで深く硬化できるか』の性質で、表面硬さそのものとは別。一般にオーステナイト結晶粒が粗いほど焼入性は高くなり、Mn・Cr・Mo・Bなどの添加でも向上する。【質量効果】断面寸法が大きいほど中心まで冷えにくく、硬化深さに差が出る。\n【この問題の正答】ウ（選択肢3）＝「S35Cは、SCM435より質量効果が小さい。」。", "type": "mcq"}, {"grade": "2級", "year": "令和5年度", "qno": 30, "question": "機械構造用炭素鋼の完全焼なまし処理に関する記述として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["Ac3変態点以上、30～50℃に加熱する。", "鋼材中心まで均一に加熱する。", "十分軟化させる目的で炉冷する。", "同じ加熱条件の場合、機械構造用合金鋼に比べて、結晶粒が粗大化しにくい。"], "answer": "エ", "category": "熱処理", "theme": "焼なまし・焼ならし", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】エ。 正答選択肢は「同じ加熱条件の場合、機械構造用合金鋼に比べて、結晶粒が粗大化しにくい。」。 【焼なまし】完全焼なましはオーステナイト化後に炉冷して軟化・組織均一化を軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【焼なまし】完全焼なましはオーステナイト化後に炉冷して軟化・組織均一化。亜共析鋼は目安としてAc₃＋30～50℃。【焼ならし】オーステナイト化後に空冷し、組織を微細化。【球状化焼なまし】炭化物を球状化し加工性・焼入れ前組織を整える。【応力除去】A₁点以下で残留応力を緩和。\n【この問題の正答】エ（選択肢4）＝「同じ加熱条件の場合、機械構造用合金鋼に比べて、結晶粒が粗大化しにくい。」。", "type": "mcq"}, {"grade": "2級", "year": "令和5年度", "qno": 31, "question": "マルテンパに関する一般的な記述として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["Ms直上の温度の熱浴で保持した後、冷却する。", "処理後に焼戻しを必要と しない。", "マルクエンチとも呼ばれる。", "オイルバスが利用できる。"], "answer": "イ", "category": "熱処理", "theme": "特殊熱処理", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】イ。 正答選択肢は「処理後に焼戻しを必要と しない。」。 【オーステンパ】ベイナイト域で等温保持→ベイナイトを軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【オーステンパ】ベイナイト域で等温保持→ベイナイト。通常の焼戻しを原則必要としにくい。【マルテンパ】Ms付近の浴で温度を均一化してから冷却→ひずみ・割れを低減し、その後焼戻し。【サブゼロ】残留オーステナイトをマルテンサイト化し寸法安定性を改善。【固溶化】ステンレス等を高温保持後急冷して析出物を固溶させる。\n【この問題の正答】イ（選択肢2）＝「処理後に焼戻しを必要と しない。」。", "type": "mcq"}, {"grade": "2級", "year": "令和5年度", "qno": 32, "question": "焼入剤の特徴に関する記述として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["空気は、水よりも冷却能が小さい。", "水は、水温が30℃の方が20℃よりも冷却能は小さい。", "焼入油は、一般に、粘度が高くなるほど冷却能は大きくなる。", "水溶液焼入剤は、濃度によって冷却能を調整できる。"], "answer": "ウ", "category": "熱処理", "theme": "焼入剤・冷却", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】ウ。 正答選択肢は「焼入油は、一般に、粘度が高くなるほど冷却能は大きくなる。」。 【冷却】水は冷却能が大きく、油は比較的緩やかを軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【冷却】水は冷却能が大きく、油は比較的緩やか。水溶性ポリマーは濃度等で冷却能を調整できる。冷却は蒸気膜→沸騰→対流の段階を経る。【時間焼入れ】途中で冷却条件を変えてひずみ・割れを抑える。強制ガス冷却はガス種・圧力・流速で冷却速度が変わる。\n【この問題の正答】ウ（選択肢3）＝「焼入油は、一般に、粘度が高くなるほど冷却能は大きくなる。」。", "type": "mcq"}, {"grade": "2級", "year": "令和5年度", "qno": 33, "question": "脱脂に関する記述として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["脱脂方法の一つとして、乳化剤脱脂法がある。", "脱脂剤の一つとして、塩素系有機溶剤がある。", "炭化水素系脱脂剤を使った脱脂方法には、蒸気法がある。", "アルカリ脱脂剤には、苛性ソーダを使用しない。"], "answer": "エ", "category": "表面処理・前処理", "theme": "脱脂・防錆", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】エ。 正答選択肢は「アルカリ脱脂剤には、苛性ソーダを使用しない。」。 【脱脂】アルカリ脱脂、溶剤脱脂、乳化脱脂などを軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【脱脂】アルカリ脱脂、溶剤脱脂、乳化脱脂など。アルカリ脱脂では水酸化ナトリウム等と界面活性剤を使う場合があり、界面活性剤は濡れ・洗浄性を高める。【防錆】油塗布、めっき、化成処理など。サンドブラストは清浄化であり防錆皮膜そのものではない。\n【この問題の正答】エ（選択肢4）＝「アルカリ脱脂剤には、苛性ソーダを使用しない。」。", "type": "mcq"}, {"grade": "2級", "year": "令和5年度", "qno": 34, "question": "鉄鋼部品のショットピーニングに用いるショットの種類として、 最も適切でないものはどれか。", "questionImage": "", "choiceImage": "", "options": ["鋳鋼ショット", "ガラスビーズ", "樹脂球", "カットワイヤショット"], "answer": "ウ", "category": "表面処理・前処理", "theme": "ショット処理", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】ウ。 正答選択肢は「樹脂球」。 【ショットピーニング】ショットを衝突させ表面に圧縮残留応力を付与し、疲労強度・応力腐食割れ抵抗を高めるを軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【ショットピーニング】ショットを衝突させ表面に圧縮残留応力を付与し、疲労強度・応力腐食割れ抵抗を高める。【ショットブラスト】主目的はスケール除去・表面清浄化。カットワイヤショットは円柱状。\n【この問題の正答】ウ（選択肢3）＝「樹脂球」。", "type": "mcq"}, {"grade": "2級", "year": "令和5年度", "qno": 35, "question": "温度制御において、現在温度が設定温度以下では操作量を100%にし、設定温度を超 えると操作量を0%にする動作に該当するものはどれか。", "questionImage": "", "choiceImage": "", "options": ["微分動作", "積分動作", "比例動作", "オンオフ動作"], "answer": "エ", "category": "熱処理設備・雰囲気", "theme": "温度制御", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】エ。 正答選択肢は「オンオフ動作」。 【温度制御】ON-OFF＝設定値を境に出力0/100%を軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【温度制御】ON-OFF＝設定値を境に出力0/100%。P＝偏差に比例、I＝定常偏差を解消、D＝変化速度を先読み。PIDはP/I/Dを組み合わせ、一般に高精度な制御が可能。D単独制御は通常行わない。\n【この問題の正答】エ（選択肢4）＝「オンオフ動作」。", "type": "mcq"}, {"grade": "2級", "year": "令和5年度", "qno": 36, "question": "キルド鋼の特徴に関する一般的な記述として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["リムド鋼よりも介在物や偏析が多い。", "けい素やアルミニウムで脱酸した鋼である。", "熱処理を施して使用する場合が多い。", "機械構造用合金鋼は、キルド鋼である。"], "answer": "ア", "category": "材料・鋼種", "theme": "鋼材・製鋼", "frequency": "★★★★☆", "frequencyYears": "2/3年", "instructor": "【正解】ア。 正答選択肢は「リムド鋼よりも介在物や偏析が多い。」。 【鋼材の基礎】キルド鋼＝SiやAl等で十分脱酸した鋼で、内部品質が比較的均一を軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【鋼材の基礎】キルド鋼＝SiやAl等で十分脱酸した鋼で、内部品質が比較的均一。偏析＝凝固時の成分偏りで、正偏析・負偏析があり、熱処理不良や割れの原因になり得る。\n【この問題の正答】ア（選択肢1）＝「リムド鋼よりも介在物や偏析が多い。」。", "type": "mcq"}, {"grade": "2級", "year": "令和5年度", "qno": 37, "question": "日本産業規格（JIS）によれば、ダイヤモンドハンマを一定の高さから落下させ、その跳ね上がり高さに比例する値を求める硬さ試験として、正しいものはどれか。", "questionImage": "", "choiceImage": "", "options": ["ロックウェル硬さ試験", "ビッカース硬さ試験", "ブリネル硬さ試験", "ショア硬さ試験"], "answer": "エ", "category": "試験・検査", "theme": "硬さ試験", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】エ。 正答選択肢は「ショア硬さ試験」。 硬さ試験は『原理→圧子→何を測るか』の3点セットで比較する。ショア＝反発、ロックウェル＝深さ、ビッカース/ブリネル＝圧痕という区別を固定する。", "memory": "【硬さ】ショア＝反発硬さ。ロックウェル＝押込み深さ、Cスケールはダイヤモンド円すい圧子・全試験力1471N・初試験力98.07N。Bスケールは球圧子。ビッカース＝ダイヤモンド四角すい圧子の圧痕。\n【この問題の正答】エ（選択肢4）＝「ショア硬さ試験」。 数値・記号はそのまま暗記候補：ショア硬さ試験。", "type": "mcq"}, {"grade": "2級", "year": "令和5年度", "qno": 38, "question": "金属材料の引張試験の目的として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["ぜい性を調べる。", "耐力を調べる。", "伸びを調べる。", "絞りを調べる。"], "answer": "ア", "category": "試験・検査", "theme": "引張試験", "frequency": "★★★★☆", "frequencyYears": "2/3年", "instructor": "【正解】ア。 正答選択肢は 回路の結線方式が決められている。", "加熱設備の形式と寸法により、保持温度測定位置が決められている。", "複数の目的温度がある場合、その温度の差の範囲により、 試験温度が決められ ている。"], "answer": "ア", "category": "熱処理設備・雰囲気", "theme": "熱処理炉・設備", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】ア。 正答選択肢は「保持温度許容差のクラスは、1～3である。」。 【熱処理炉】炉内壁には耐火材・断熱材を使用を軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【熱処理炉】炉内壁には耐火材・断熱材を使用。誘導加熱は急速加熱が可能。【有効加熱帯】所定の温度許容差を満たす領域で、測定位置は炉形式・寸法等で決まる。『炉内寸法＝有効加熱帯』ではない。\n【この問題の正答】ア（選択肢1）＝「保持温度許容差のクラスは、1～3である。」。", "type": "mcq"}, {"grade": "2級", "year": "令和5年度", "qno": 48, "question": "熱処理欠陥の原因に関する記述として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["結晶粒の粗大化には、加熱温度が高いほど、 保持時間が長いほど、影響は大き い。", "焼入変形の原因の一つとして、 加熱及び冷却を行う際の熱応力と変態応力の合 成がある。", "鍛造品を焼入れしたときに生じる割れは、 パーティングライン上には発生しな い。", "焼入品を焼戻しする際、急熱、急冷又は組織変化のために、 割れが発生する場 合がある。"], "answer": "ウ", "category": "熱処理", "theme": "熱処理欠陥", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】ウ。 正答選択肢は「鍛造品を焼入れしたときに生じる割れは、 パーティングライン上には発生しな い。」。 【欠陥原因】高温・長時間加熱→結晶粒粗大化を軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【欠陥原因】高温・長時間加熱→結晶粒粗大化。不均一加熱/冷却、気泡・スケール・焼入液汚染→焼むら/軟点。急冷、断面急変、鋭い角・切欠き→応力集中で焼割れ。焼入変形は熱応力＋変態応力の影響を受ける。\n【この問題の正答】ウ（選択肢3）＝「鍛造品を焼入れしたときに生じる割れは、 パーティングライン上には発生しな い。」。", "type": "mcq"}, {"grade": "2級", "year": "令和5年度", "qno": 49, "question": "日本産業規格（JIS）によれば、ロックウェル硬さ試験の試験方法として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["ロックウェル硬さの初試験力は、29.42Nである。", "Cスケールの全試験力は、1471Nである。", "Bスケールの圧子は、直径1.5875mmの球である。", "ロックウェル硬さは、スケールごとに適用する硬さ範囲が規定されている。"], "answer": "ア", "category": "試験・検査", "theme": "硬さ試験", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】ア。 正答選択肢は「ロックウェル硬さの初試験力は、29.42Nである。」。 硬さ試験は『原理→圧子→何を測るか』の3点セットで比較する。ショア＝反発、ロックウェル＝深さ、ビッカース/ブリネル＝圧痕という区別を固定する。", "memory": "【硬さ】ショア＝反発硬さ。ロックウェル＝押込み深さ、Cスケールはダイヤモンド円すい圧子・全試験力1471N・初試験力98.07N。Bスケールは球圧子。ビッカース＝ダイヤモンド四角すい圧子の圧痕。\n【この問題の正答】ア（選択肢1）＝「ロックウェル硬さの初試験力は、29.42Nである。」。 数値・記号はそのまま暗記候補：ロックウェル硬さの初試験力は、29.42Nである。。", "type": "mcq"}, {"grade": "2級", "year": "令和5年度", "qno": 50, "question": "日本産業規格（JIS）の「鋼の脱炭層深さ測定方法」 において、 測定方法として規定され ていないものはどれか。", "questionImage": "", "choiceImage": "", "options": ["顕微鏡による測定方法", "硬さ試験による測定方法", "マクロ組織試験による測定方法", "炭素含有率による測定方法"], "answer": "ウ", "category": "熱処理", "theme": "脱炭・脱炭層測定", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】ウ。 正答選択肢は「マクロ組織試験による測定方法」。 【脱炭】酸化性雰囲気で表面炭素が減少し、温度・時間・雰囲気の影響を受けるを軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【脱炭】酸化性雰囲気で表面炭素が減少し、温度・時間・雰囲気の影響を受ける。【測定】顕微鏡、硬さ、炭素含有率による方法を整理。硬さ法による全脱炭層深さの表示記号として、令和7年度問題ではDH-Tが正答。\n【この問題の正答】ウ（選択肢3）＝「マクロ組織試験による測定方法」。", "type": "mcq"}, {"grade": "2級", "year": "令和6年度", "qno": 1, "question": "鉄-炭素系平衡状態図において、共析反応は、次式で表すことができる。オーステナイト → フェライト＋セメンタイト", "questionImage": "", "choiceImage": "", "options": ["○", "×", "", ""], "answer": "○", "category": "金属組織・変態", "theme": "Fe-C系状態図・組織", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】○。記述は出題資料の正解表では正しい扱い。 Fe-C状態図は、炭素量が共析組成より左か右かを最初に判断させる。『亜共析＝初析フェライト』『過共析＝初析セメンタイト』『Fe₃C＝セメンタイト』を得点源にする。", "memory": "【Fe-C系】Fe₃C＝セメンタイト。パーライト＝フェライト＋セメンタイトの層状組織。共析組成は約0.77%C、A₁点は約727℃。亜共析鋼を徐冷→初析フェライト＋パーライト、過共析鋼を徐冷→初析セメンタイト＋パーライト。", "type": "tf"}, {"grade": "2級", "year": "令和6年度", "qno": 2, "question": "マルテンサイト組織の鋼を600℃で焼戻しすると、ソルバイト組織が得られる。", "questionImage": "", "choiceImage": "", "options": ["○", "×", "", ""], "answer": "○", "category": "熱処理", "theme": "焼戻し・調質", "frequency": "★★★★☆", "frequencyYears": "2/3年", "instructor": "【正解】○。記述は出題資料の正解表では正しい扱い。 【焼戻し】焼入れマルテンサイトを再加熱して靭性・寸法安定性を改善を軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【焼戻し】焼入れマルテンサイトを再加熱して靭性・寸法安定性を改善。低温焼戻しは硬さ重視、高温焼戻しは靭性重視。【調質】焼入れ＋高温焼戻し。【プレステンパ】焼戻し中に拘束して変形を抑える・矯正する。Mo添加は高温焼戻ぜい性の抑制に有効。", "type": "tf"}, {"grade": "2級", "year": "令和6年度", "qno": 3, "question": "Ms（Ar″）は、鋼の焼入れにおいて、オーステナイトがパーライトに変化を開始する温度を表す記号である。", "questionImage": "", "choiceImage": "", "options": ["○", "×", "", ""], "answer": "×", "category": "金属組織・変態", "theme": "TTT/CCT・変態点", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】×。「パーライト」の定義・条件とのズレを見抜く問題。 Ac/Ar、Ms/Mf、TTT/CCTを混同しやすいので、加熱/冷却/等温/連続冷却の4軸で整理する。Msは開始、Mfは終了と必ず対にして覚えさせる。", "memory": "【変態点・曲線】TTT＝等温変態曲線（一定温度で保持した変態）、CCT＝連続冷却変態曲線。Acは加熱時、Arは冷却時。Ac₁＝オーステナイト生成開始、Ac₃＝亜共析鋼のオーステナイト化完了。Ms＝マルテンサイト変態開始、Mf＝終了。", "type": "tf"}, {"grade": "2級", "year": "令和6年度", "qno": 4, "question": "同一鋼種であれば、オーステナイト結晶粒の大きさは、焼入性には影響を与えない。", "questionImage": "", "choiceImage": "", "options": ["○", "×", "", ""], "answer": "×", "category": "金属組織・変態", "theme": "焼入性・質量効果", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】×。「焼入性」の定義・条件とのズレを見抜く問題。 『焼入性＝硬さの高さ』という誤解を最初に外す。鋼種・結晶粒・合金元素と、断面寸法による質量効果を関連づけて説明する。", "memory": "【焼入性】『どこまで深く硬化できるか』の性質で、表面硬さそのものとは別。一般にオーステナイト結晶粒が粗いほど焼入性は高くなり、Mn・Cr・Mo・Bなどの添加でも向上する。【質量効果】断面寸法が大きいほど中心まで冷えにくく、硬化深さに差が出る。", "type": "tf"}, {"grade": "2級", "year": "令和6年度", "qno": 5, "question": "高炭素クロム軸受鋼の球状化焼なまし温度における保持時間は、一般に、 炭素工具鋼 における保持時間よりも短くする。", "questionImage": "", "choiceImage": "", "options": ["○", "×", "", ""], "answer": "×", "category": "熱処理", "theme": "焼なまし・焼ならし", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】×。「球状化焼なまし」の定義・条件とのズレを見抜く問題。 【焼なまし】完全焼なましはオーステナイト化後に炉冷して軟化・組織均一化を軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【焼なまし】完全焼なましはオーステナイト化後に炉冷して軟化・組織均一化。亜共析鋼は目安としてAc₃＋30～50℃。【焼ならし】オーステナイト化後に空冷し、組織を微細化。【球状化焼なまし】炭化物を球状化し加工性・焼入れ前組織を整える。【応力除去】A₁点以下で残留応力を緩和。", "type": "tf"}, {"grade": "2級", "year": "令和6年度", "qno": 6, "question": "焼戻しの際、部分的な残留応力の解放によるひずみ発生の危険が大きい場合は、金型で押さえ込んだり、プレスしたままで加熱冷却することがある。", "questionImage": "", "choiceImage": "", "options": ["○", "×", "", ""], "answer": "○", "category": "熱処理", "theme": "焼戻し・調質", "frequency": "★★★★☆", "frequencyYears": "2/3年", "instructor": "【正解】○。記述は出題資料の正解表では正しい扱い。 【焼戻し】焼入れマルテンサイトを再加熱して靭性・寸法安定性を改善を軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【焼戻し】焼入れマルテンサイトを再加熱して靭性・寸法安定性を改善。低温焼戻しは硬さ重視、高温焼戻しは靭性重視。【調質】焼入れ＋高温焼戻し。【プレステンパ】焼戻し中に 、Arは冷却時。Ac₁＝オーステナイト生成開始、Ac₃＝亜共析鋼のオーステナイト化完了。Ms＝マルテンサイト変態開始、Mf＝終了。\n【この問題の正答】ア（選択肢1）＝「CCT曲線」。 数値・記号はそのまま暗記候補：CCT曲線。", "type": "mcq"}, {"grade": "2級", "year": "令和6年度", "qno": 29, "question": "鋼に含まれる次の合金元素のうち、焼入性倍数が最も大きいものはどれか。", "questionImage": "", "choiceImage": "", "options": ["Si", "Mn", "Cr", "Ni"], "answer": "イ", "category": "金属組織・変態", "theme": "焼入性・質量効果", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】イ。 正答選択肢は「Mn」。 『焼入性＝硬さの高さ』という誤解を最初に外す。鋼種・結晶粒・合金元素と、断面寸法による質量効果を関連づけて説明する。", "memory": "【焼入性】『どこまで深く硬化できるか』の性質で、表面硬さそのものとは別。一般にオーステナイト結晶粒が粗いほど焼入性は高くなり、Mn・Cr・Mo・Bなどの添加でも向上する。【質量効果】断面寸法が大きいほど中心まで冷えにくく、硬化深さに差が出る。\n【この問題の正答】イ（選択肢2）＝「Mn」。", "type": "mcq"}, {"grade": "2級", "year": "令和6年度", "qno": 30, "question": "サブゼロ処理に関する一般的な記述として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["焼入れ後の残留オーステナイトをマルテンサイト化するために行う。", "割れを防止するため、湯戻しを行ってからサブゼロ処理を行う場合もある。", "寸法の経年変化を防止できる。", "液体窒素を使用する場合、-70℃が下限である。"], "answer": "エ", "category": "熱処理", "theme": "特殊熱処理", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】エ。 正答選択肢は「液体窒素を使用する場合、-70℃が下限である。」。 【オーステンパ】ベイナイト域で等温保持→ベイナイトを軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【オーステンパ】ベイナイト域で等温保持→ベイナイト。通常の焼戻しを原則必要としにくい。【マルテンパ】Ms付近の浴で温度を均一化してから冷却→ひずみ・割れを低減し、その後焼戻し。【サブゼロ】残留オーステナイトをマルテンサイト化し寸法安定性を改善。【固溶化】ステンレス等を高温保持後急冷して析出物を固溶させる。\n【この問題の正答】エ（選択肢4）＝「液体窒素を使用する場合、-70℃が下限である。」。 数値・記号はそのまま暗記候補：液体窒素を使用する場合、-70℃が下限である。。", "type": "mcq"}, {"grade": "2級", "year": "令和6年度", "qno": 31, "question": "ガス窒化処理に関する一般的な記述として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["処理温度は、500～550℃で行う。", "鋼に化合物層と拡散層を形成させる処理である。", "アルミニウムやクロムよりもニッケルやコバルトを含む鋼の方が硬化する。", "窒化処理後、焼戻しを必要としない。"], "answer": "ウ", "category": "表面処理・前処理", "theme": "窒化処理", "frequency": "★★☆☆☆", "frequencyYears": "1/3年", "instructor": "【正解】ウ。 正答選択肢は「アルミニウムやクロムよりもニッケルやコバルトを含む鋼の方が硬化する。」。 【ガス窒化】アンモニア等から窒素を表面へ拡散させ、化合物層＋拡散層を形成を軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【ガス窒化】アンモニア等から窒素を表面へ拡散させ、化合物層＋拡散層を形成。500～550℃程度で処理し、高硬さ・耐摩耗・疲労強度向上、ひずみが小さい。処理後の焼入れは原則不要。\n【この問題の正答】ウ（選択肢3）＝「アルミニウムやクロムよりもニッケルやコバルトを含む鋼の方が硬化する。」。", "type": "mcq"}, {"grade": "2級", "year": "令和6年度", "qno": 32, "question": "加熱炉の炉材に関する記述として、適切でないものはどれか。", "questionImage": "", "choiceImage": "", "options": ["加熱炉の内壁の炉材には、耐火材と断熱材が用いられる。", "中性耐火材は、マグネシアを主成分としている。", "耐火材には、中性のほかに、酸性や塩基性のものもある。", "断熱材として、セラミックファイバも使われる。"], "answer": "イ", "category": "熱処理設備・雰囲気", "theme": "熱処理炉・設備", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】イ。 正答選択肢は「中性耐火材は、マグネシアを主成分としている。」。 【熱処理炉】炉内壁には耐火材・断熱材を使用を軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【熱処理炉】炉内壁には耐火材・断熱材を使用。誘導加熱は急速加熱が可能。【有効加熱帯】所定の温度許容差を満たす領域で、測定位置は炉形式・寸法等で決まる。『炉内寸法＝有効加熱帯』ではない。\n【この問題の正答】イ（選択肢2）＝「中性耐火材は、マグネシアを主成分としている。」。", "type": "mcq"}, {"grade": "2級", "year": "令和6年度", "qno": 33, "question": "ショットピーニングが与える効果として、適切でないものはどれか。", "questionImage": "", "choiceImage": "", "options": ["表面近傍を加工硬化させる。", "表層の残留オーステナイトの一部をマルテンサイトに変態させる。", "軟らかい表層の微細なキズや欠陥を潰す。", "表層に引張残留応力を与える。"], "answer": "エ", "category": "表面処理・前処理", "theme": "ショット処理", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】エ。 正答選択肢は「表層に引張残留応力を与える。」。 【ショットピーニング】ショットを衝突させ表面に圧縮残留応力を付与し、疲労強度・応力腐食割れ抵抗を高めるを軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【ショットピーニング】ショットを衝突させ表面に圧縮残留応力を付与し、疲労強度・応力腐食割れ抵抗を高める。【ショットブラスト】主目的はスケール除去・表面清浄化。カットワイヤショットは円柱状。\n【この問題の正答】エ（選択肢4）＝「表層に引張残留応力を与える。」。", "type": "mcq"}, {"grade": "2級", "year": "令和6年度", "qno": 34, "question": "防錆処理の方法として、適切でないものはどれか。", "questionImage": "", "choiceImage": "", "options": ["化成処理", "油塗布", "めっき", "サンドブラスト"], "answer": "エ", "category": "表面処理・前処理", "theme": "脱脂・防錆", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】エ。 正答選択肢は「サンドブラスト」。 【脱脂】アルカリ脱脂、溶剤脱脂、乳化脱脂などを軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【脱脂】アルカリ脱脂、溶剤脱脂、乳化脱脂など。アルカリ脱脂では水酸化ナトリウム等と界面活性剤を使う場合があり、界面活性剤は濡れ・洗浄性を高める。【防錆】油塗布、めっき、化成処理など。サンド eImage": "", "options": ["○", "×", "", ""], "answer": "○", "category": "金属組織・変態", "theme": "Fe-C系状態図・組織", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】○。記述は出題資料の正解表では正しい扱い。 Fe-C状態図は、炭素量が共析組成より左か右かを最初に判断させる。『亜共析＝初析フェライト』『過共析＝初析セメンタイト』『Fe₃C＝セメンタイト』を得点源にする。", "memory": "【Fe-C系】Fe₃C＝セメンタイト。パーライト＝フェライト＋セメンタイトの層状組織。共析組成は約0.77%C、A₁点は約727℃。亜共析鋼を徐冷→初析フェライト＋パーライト、過共析鋼を徐冷→初析セメンタイト＋パーライト。", "type": "tf"}, {"grade": "2級", "year": "令和7年度", "qno": 2, "question": "日本産業規格（JIS）の「鋼一結晶粒度の顕微鏡試験方法」では、粒度番号5以上の鋼を 細粒鋼と規定している。", "questionImage": "", "choiceImage": "", "options": ["○", "×", "", ""], "answer": "○", "category": "試験・検査", "theme": "組織・破面・介在物検査", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】○。記述は出題資料の正解表では正しい扱い。 【破面観察】疲労・ぜい性・延性破壊などの特徴を観察できるを軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【破面観察】疲労・ぜい性・延性破壊などの特徴を観察できる。【サルファプリント】硫化物の分布を可視化し偏析・均質性を評価。【非金属介在物】顕微鏡試験で種類・分布を評価。結晶粒度は粒度番号が大きいほど細粒。", "type": "tf"}, {"grade": "2級", "year": "令和7年度", "qno": 3, "question": "Ms点とは、オーステナイトからマルテンサイトへの変態が終了する温度である。", "questionImage": "", "choiceImage": "", "options": ["○", "×", "", ""], "answer": "×", "category": "金属組織・変態", "theme": "TTT/CCT・変態点", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】×。「Ms」の定義・条件とのズレを見抜く問題。 Ac/Ar、Ms/Mf、TTT/CCTを混同しやすいので、加熱/冷却/等温/連続冷却の4軸で整理する。Msは開始、Mfは終了と必ず対にして覚えさせる。", "memory": "【変態点・曲線】TTT＝等温変態曲線（一定温度で保持した変態）、CCT＝連続冷却変態曲線。Acは加熱時、Arは冷却時。Ac₁＝オーステナイト生成開始、Ac₃＝亜共析鋼のオーステナイト化完了。Ms＝マルテンサイト変態開始、Mf＝終了。", "type": "tf"}, {"grade": "2級", "year": "令和7年度", "qno": 4, "question": "同一鋼種においては、オーステナイト結晶粒径が大きいものほど、焼入性が悪い。", "questionImage": "", "choiceImage": "", "options": ["○", "×", "", ""], "answer": "×", "category": "金属組織・変態", "theme": "焼入性・質量効果", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】×。「焼入性」の定義・条件とのズレを見抜く問題。 『焼入性＝硬さの高さ』という誤解を最初に外す。鋼種・結晶粒・合金元素と、断面寸法による質量効果を関連づけて説明する。", "memory": "【焼入性】『どこまで深く硬化できるか』の性質で、表面硬さそのものとは別。一般にオーステナイト結晶粒が粗いほど焼入性は高くなり、Mn・Cr・Mo・Bなどの添加でも向上する。【質量効果】 て覚えさせる。", "memory": "【変態点・曲線】TTT＝等温変態曲線（一定温度で保持した変態）、CCT＝連続冷却変態曲線。Acは加熱時、Arは冷却時。Ac₁＝オーステナイト生成開始、Ac₃＝亜共析鋼のオーステナイト化完了。Ms＝マルテンサイト変態開始、Mf＝終了。\n【この問題の正答】ウ（選択肢3）＝「Ac1」。 数値・記号はそのまま暗記候補：Ac1。", "type": "mcq"}, {"grade": "2級", "year": "令和7年度", "qno": 27, "question": "パーライトを構成する組織として、正しいものはどれか。", "questionImage": "", "choiceImage": "", "options": ["フェライト＋セメンタイト", "フェライト＋オーステナイト", "オーステナイト＋セメンタイト", "フェライト＋グラファイト"], "answer": "ア", "category": "金属組織・変態", "theme": "Fe-C系状態図・組織", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】ア。 正答選択肢は「フェライト＋セメンタイト」。 Fe-C状態図は、炭素量が共析組成より左か右かを最初に判断させる。『亜共析＝初析フェライト』『過共析＝初析セメンタイト』『Fe₃C＝セメンタイト』を得点源にする。", "memory": "【Fe-C系】Fe₃C＝セメンタイト。パーライト＝フェライト＋セメンタイトの層状組織。共析組成は約0.77%C、A₁点は約727℃。亜共析鋼を徐冷→初析フェライト＋パーライト、過共析鋼を徐冷→初析セメンタイト＋パーライト。\n【この問題の正答】ア（選択肢1）＝「フェライト＋セメンタイト」。", "type": "mcq"}, {"grade": "2級", "year": "令和7年度", "qno": 28, "question": "鋼の等温変態曲線の他の呼び方として、正しいものはどれか。", "questionImage": "", "choiceImage": "", "options": ["CCT曲線", "S-N曲線", "TTT曲線", "U曲線"], "answer": "ウ", "category": "金属組織・変態", "theme": "TTT/CCT・変態点", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】ウ。 正答選択肢は「TTT曲線」。 Ac/Ar、Ms/Mf、TTT/CCTを混同しやすいので、加熱/冷却/等温/連続冷却の4軸で整理する。Msは開始、Mfは終了と必ず対にして覚えさせる。", "memory": "【変態点・曲線】TTT＝等温変態曲線（一定温度で保持した変態）、CCT＝連続冷却変態曲線。Acは加熱時、Arは冷却時。Ac₁＝オーステナイト生成開始、Ac₃＝亜共析鋼のオーステナイト化完了。Ms＝マルテンサイト変態開始、Mf＝終了。\n【この問題の正答】ウ（選択肢3）＝「TTT曲線」。 数値・記号はそのまま暗記候補：TTT曲線。", "type": "mcq"}, {"grade": "2級", "year": "令和7年度", "qno": 29, "question": "臨界冷却速度に関する記述として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["マルテンサイト変態を生じるために必要な最小の冷却速度のことである。", "上部臨界冷却速度と下部臨界冷却速度がある。", "上部臨界冷却速度とは、マルテンサイト組織だけとなる最小の冷却速度であ る。", "添加元素の種類による影響はない。"], "answer": "エ", "category": "金属組織・変態", "theme": "焼入性・質量効果", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】エ。 正答選択肢は「添加元素の種類による影響はない。」。 『焼入性＝硬さの高さ』という誤解を最初に外す。鋼種・結晶粒・合金元素と、断面寸法による質量効果を関連づけて説明する。", "memory": "【焼入性】『どこまで深く硬化できるか』の性質で、表面硬さそのものとは別。一般にオーステナイト結晶粒が粗いほど焼入性は高くなり、Mn・Cr・Mo・Bなどの添加でも向上する。【質量効果】断面寸法が大きいほど中心まで冷えにくく、硬化深さに差が出る。\n【この問題の正答】エ（選択肢4）＝「添加元素の種類による影響はない。」。", "type": "mcq"}, {"grade": "2級", "year": "令和7年度", "qno": 30, "question": "オーステナイト系ステンレス鋼の固溶化熱処理に関する記述として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["均一なオーステナイト組織にするために行う。", "日本産業規格（JIS）では、固溶化熱処理後の機械的性質が規定されている。", "SUS304の固溶化熱処理温度は、1010～1150℃である。", "加熱後の冷却によって硬くなる。"], "answer": "エ", "category": "熱処理", "theme": "特殊熱処理", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】エ。 正答選択肢は「加熱後の冷却によって硬くなる。」。 【オーステンパ】ベイナイト域で等温保持→ベイナイトを軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【オーステンパ】ベイナイト域で等温保持→ベイナイト。通常の焼戻しを原則必要としにくい。【マルテンパ】Ms付近の浴で温度を均一化してから冷却→ひずみ・割れを低減し、その後焼戻し。【サブゼロ】残留オーステナイトをマルテンサイト化し寸法安定性を改善。【固溶化】ステンレス等を高温保持後急冷して析出物を固溶させる。\n【この問題の正答】エ（選択肢4）＝「加熱後の冷却によって硬くなる。」。", "type": "mcq"}, {"grade": "2級", "year": "令和7年度", "qno": 31, "question": "応力除去焼なましの目的として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["鋳造で発生した残留応力の緩和", "ショットピーニングで生成された表面近傍の圧縮残留応力の緩和", "溶接で発生した残留応力の緩和", "機械加工で発生した残留応力の緩和"], "answer": "イ", "category": "熱処理", "theme": "焼なまし・焼ならし", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】イ。 正答選択肢は「ショットピーニングで生成された表面近傍の圧縮残留応力の緩和」。 【焼なまし】完全焼なましはオーステナイト化後に炉冷して軟化・組織均一化を軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【焼なまし】完全焼なましはオーステナイト化後に炉冷して軟化・組織均一化。亜共析鋼は目安としてAc₃＋30～50℃。【焼ならし】オーステナイト化後に空冷し、組織を微細化。【球状化焼なまし】炭化物を球状化し加工性・焼入れ前組織を整える。【応力除去】A₁点以下で残留応力を緩和。\n【この問題の正答】イ（選択肢2）＝「ショットピーニングで生成された表面近傍の圧縮残留応力の緩和」。", "type": "mcq"}, {"grade": "2級", "year": "令和7年度", "qno": 32, "question": "加熱装置の熱源に関する記述として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["熱処理炉の熱源には、液体燃料、気体燃料等がある。", "誘導加熱は、急速加熱ができない。", "電気加熱の発熱体には、非金属発熱体がある。", "気体燃料のプロパンガスは、同容量のブタンガスよりも発熱量が小さい。"], "answer": "イ", "category": "熱処理設備・雰囲気", "theme": "熱処理炉・設備", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】イ。 正答選択肢は「誘導加熱は、急速加熱ができない。」。 【熱処理炉】炉内壁には耐火材・断熱材を使用を軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【熱処理炉】炉内壁には耐火材・断熱材を使用。誘導加熱は急速加熱が可能。【有効加熱帯】所定の温度許容差を満たす領域で、測定位置は炉形式・寸法等で決まる。『炉内寸法＝有効加熱帯』ではない。\n【この問題の正答】イ（選択肢2）＝「誘導加熱は、急速加熱ができない。」。", "type": "mcq"}, {"grade": "2級", "year": "令和7年度", "qno": 33, "question": "日本産業規格（JIS）の「ばねのショットピーニング」によれば、ショットの形状が円柱であるものはどれか。", "questionImage": "", "choiceImage": "", "options": ["鋳鋼ショット", "ガラスビーズ", "セラミックビーズ", "カットワイヤショット"], "answer": "エ", "category": "表面処理・前処理", "theme": "ショット処理", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】エ。 正答選択肢は「カットワイヤショット」。 【ショットピーニング】ショットを衝突させ表面に圧縮残留応力を付与し、疲労強度・応力腐食割れ抵抗を高めるを軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【ショットピーニング】ショットを衝突させ表面に圧縮残留応力を付与し、疲労強度・応力腐食割れ抵抗を高める。【ショットブラスト】主目的はスケール除去・表面清浄化。カットワイヤショットは円柱状。\n【この問題の正答】エ（選択肢4）＝「カットワイヤショット」。", "type": "mcq"}, {"grade": "2級", "year": "令和7年度", "qno": 34, "question": "脱脂剤に関する記述として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["脱脂剤の一つとして、乳化剤がある。", "脱脂剤の一つとして、塩素系有機溶剤がある。", "炭化水素系脱脂剤を使った脱脂方法には、蒸気法がある。", "アルカリ脱脂剤には、水酸化ナトリウム(苛性ソーダ)を使用しない。"], "answer": "エ", "category": "表面処理・前処理", "theme": "脱脂・防錆", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】エ。 正答選択肢は「アルカリ脱脂剤には、水酸化ナトリウム(苛性ソーダ)を使用しない。」。 【脱脂】アルカリ脱脂、溶剤脱脂、乳化脱脂などを軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【脱脂】アルカリ脱脂、溶剤脱脂、乳化脱脂など。アルカリ脱脂では水酸化ナトリウム等と界面活性剤を使う場合があり、界面活性剤は濡れ・洗浄性を高める。【防錆】油塗布、めっき、化成処理など。サンドブラストは清浄化であり防錆皮膜そのものではない。\n【この問題の正答】エ（選択肢4）＝「アルカリ脱脂剤には、水酸化ナトリウム(苛性ソーダ)を使用しない。」。", "type": "mcq"}, {"grade": "2級", "year": "令和7年度", "qno": 35, "question": "電気炉の温度自動制御方式に関する記述として、誤っているものはどれか。", "questionImage": "", "choiceImage": "", "options": ["動作の種類には、比例動作、微分動作、積分動作等がある。", "比例動作は、設定値と測定値の差(偏差)に対 し、出力が比例する。", "比例動作は、オフセット(定常的に残る偏差)を防ぐことができない。", "微分動作単独での制御も可能である。"], "answer": "エ", "category": "熱処理設備・雰囲気", "theme": "温度制御", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】エ。 正答選択肢は「微分動作単独での制御も可能である。」。 【温度制御】ON-OFF＝設定値を境に出力0/100%を軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【温度制御】ON-OFF＝設定値を境に出力0/100%。P＝偏差に比例、I＝定常偏差を解消、D＝変化速度を先読み。PIDはP/I/Dを組み合わせ、一般に高精度な制御が可能。D単独制御は通常行わない。\n【この問題の正答】エ（選択肢4）＝「微分動作単独での制御も可能である。」。", "type": "mcq"}, {"grade": "2級", "year": "令和7年度", "qno": 36, "question": "偏析に関する記述として、適切でないものはどれか。", "questionImage": "", "choiceImage": "", "options": ["正偏析と負偏析がある。", "凝固速度を遅くすることによって防止することができる。", "焼割れや焼むらなどの原因になる。", "偏析帯には不純物や非金属介在物が多く存在する。"], "answer": "イ", "category": "材料・鋼種", "theme": "鋼材・製鋼", "frequency": "★★★★☆", "frequencyYears": "2/3年", "instructor": "【正解】イ。 正答選択肢は「凝固速度を遅くすることによって防止することができる。」。 【鋼材の基礎】キルド鋼＝SiやAl等で十分脱酸した鋼で、内部品質が比較的均一を軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【鋼材の基礎】キルド鋼＝SiやAl等で十分脱酸した鋼で、内部品質が比較的均一。偏析＝凝固時の成分偏りで、正偏析・負偏析があり、熱処理不良や割れの原因になり得る。\n【この問題の正答】イ（選択肢2）＝「凝固速度を遅くすることによって防止することができる。」。", "type": "mcq"}, {"grade": "2級", "year": "令和7年度", "qno": 37, "question": "日本産業規格（JIS）の「金属材料引張試験方法」 によれば、 引張試験で求めることがで きない特性はどれか。", "questionImage": "", "choiceImage": "", "options": ["引張強さ", "絞り", "遷移温度", "伸び"], "answer": "ウ", "category": "試験・検査", "theme": "引張試験", "frequency": "★★★★☆", "frequencyYears": "2/3年", "instructor": "【正解】ウ。 正答選択肢は「遷移温度」。 【引張試験】引張強さ、耐力/降伏点、伸び、絞りなどを求めるを軸に、名称だけでなく『何を目的に・どの条件で・何が得られるか』を対比して説明する。選択肢問題では誤答側の用語も一緒に整理する。", "memory": "【引張試験】引張強さ、耐力/降伏点、伸び、絞りなどを求める。遷移温度や『ぜい性そのもの』は通常、引張試験の直接の測定項目ではない。\n【この問題の正答】ウ（選択肢3）＝「遷移温度」。", "type": "mcq"}, {"grade": "2級", "year": "令和7年度", "qno": 38, "question": "硬さ試験のうち、反発硬さを測定するものはどれか。", "questionImage": "", "choiceImage": "", "options": ["ロックウェル硬さ試験", "ブリネル硬さ試験", "ショア硬さ試験", "ビッカース硬さ試験"], "answer": "ウ", "category": "試験・検査", "theme": "硬さ試験", "frequency": "★★★★★", "frequencyYears": "3/3年", "instructor": "【正解】ウ。 正答選択肢は「ショア硬さ試験」。 硬さ試験は『原理→圧子→何を測るか』の3点セットで比較する。ショア＝反発、ロックウェル＝深さ、ビッカース/ブリネル＝圧痕という区別を固定する。", "memory": "【硬さ】ショア＝反発硬さ。ロックウェル＝押込み深さ、Cスケールはダイヤモンド円すい圧子・全試験力1471N・初試験力98.07N。Bスケールは球圧子。ビッカース＝ダイヤモンド四角すい圧子の圧痕。\n【この問題の正答】ウ（選択肢3）＝「ショア硬さ試験」。 数値・記号はそのまま暗記候補：ショア硬さ試験。", "type": "mcq"}, {" let pool=[],index=0,answered=false,correct=0,attempts=0,wrongKeys=new Set(),randomMode=false,deferredPrompt=null;
const el=id=>document.getElementById(id);
const views=["homeView","quizView","wrongView","statsView"];
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function key(q){return `${q.year}-${q.qno}`}
function uniq(a){return [...new Set(a)].filter(Boolean).sort((a,b)=>String(a).localeCompare(String(b),"ja",{numeric:true}))}
function fill(sel,items,first){const v=sel.value;sel.innerHTML=`<option value="">${first}</option>`+items.map(x=>`<option>${esc(x)}</option>`).join("");if(items.includes(v))sel.value=v}
function filtered(){return ALL.filter(q=>(!el("year").value||q.year===el("year").value)&&(!el("category").value||q.category===el("category").value)&&(!el("theme").value||q.theme===el("theme").value))}
function refresh(){
 let b=ALL;
 fill(el("year"),uniq(b.map(q=>q.year)),"全年度");
 if(el("year").value)b=b.filter(q=>q.year===el("year").value);
 fill(el("category"),uniq(b.map(q=>q.category)),"全分野");
 if(el("category").value)b=b.filter(q=>q.category===el("category").value);
 fill(el("theme"),uniq(b.map(q=>q.theme)),"全小テーマ");
 updateStats();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function showView(v){views.forEach(x=>el(x).classList.toggle("hidden",x!==v));document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.view===v));if(v==="wrongView")renderWrong();if(v==="statsView")renderStats()}
function start(mode="normal"){pool=filtered();if(mode==="wrong")pool=pool.filter(q=>wrongKeys.has(key(q)));if(randomMode)pool=shuffle([...pool]);index=0;renderQuestion();showView("quizView")}
function answerIndex(q){if(q.type==="tf")return q.answer==="○"?0:q.answer==="×"?1:-1;return {"ア":0,"イ":1,"ウ":2,"エ":3}[q.answer]??-1}
function renderQuestion(){
 updateStats();
 const c=el("quizCard"); if(!pool.length){c.innerHTML=`<div class="empty">該当する問題がありません。</div>`;return}
 const q=pool[index];answered=false;
 const choices=q.type==="tf"?["○","×"]:q.options;
 const labels=q.type==="tf"?["○","×"]:["ア","イ","ウ","エ"];
 c.innerHTML=`
 <div class="meta"><span class="tag">2級</span><span class="tag">${esc(q.year)}</span><span class="tag">問${q.qno}</span><span class="tag">${esc(q.category)}</span><span class="tag">${esc(q.theme)}</span><span class="tag hot">${esc(q.frequency)} ${esc(q.frequencyYears)}</span></div>
 <div class="small">${index+1} / ${pool.length}</div>
 <div class="qtext">${esc(q.question)}</div>
 ${q.questionImage?`<img class="fig" src="${q.questionImage}" alt="問題図">`:""}
 ${q.choiceImage?`<img class="fig" src="${q.choiceImage}" alt="選択肢の図">`:""}
 <div class="options">${choices.map((x,i)=>x?`<button class="opt" data-i="${i}"><span class="mark">${labels[i]}</span><span>${esc(x)}</span></button>`:"").join("")}</div>
 <div id="result" class="result"></div>
 <div id="details" class="details"><h3>✅ 正解</h3><p>${esc(q.answer)}</p><h3>🧠 覚える語句・意味</h3><p>${esc(q.memory||"—")}</p><h3>👨‍🏫 講師用解説</h3><p>${esc(q.instructor||"—")}</p></div>
 <div class="navline"><button id="prevBtn">← 前へ</button><button id="showBtn">答え・解説</button><button id="nextBtn" class="primary">次へ →</button></div>`;
 [...c.querySelectorAll(".opt")].forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));
 el("prevBtn").onclick=()=>{if(index>0){index--;renderQuestion()}};
 el("nextBtn").onclick=()=>{if(index<pool.length-1){index++;renderQuestion()}else{index=0;renderQuestion()}};
 el("showBtn").onclick=()=>el("details").classList.add("show");
}
function choose(sel){
 if(answered)return;answered=true;attempts++;
 const q=pool[index],ans=answerIndex(q),bs=[...document.querySelectorAll(".opt")],res=el("result");bs.forEach(b=>b.disabled=true);
 if(sel===ans){correct++;res.className="result ok";res.textContent="⭕ 正解！";bs[sel]?.classList.add("correct");wrongKeys.delete(key(q))}
 else{res.className="result ng";res.textContent=`❌ 不正解　正解：${q.answer}`;bs[sel]?.classList.add("wrong");bs[ans]?.classList.add("correct");wrongKeys.add(key(q))}
 el("details").classList.add("show");save();updateStats();
}
function renderWrong(){
 const list=el("wrongList"),items=ALL.filter(q=>wrongKeys.has(key(q)));
 if(!items.length){list.innerHTML=`<div class="empty">まだ間違えた問題はありません。</div>`;return}
 list.innerHTML=items.map(q=>`<div class="listItem"><h4>${esc(q.year)} 問${q.qno}｜${esc(q.theme)}</h4><div class="small">${esc(q.category)}　${esc(q.frequency)}</div><div style="margin-top:6px">${esc(q.question).slice(0,110)}${q.question.length>110?"…":""}</div><button style="margin-top:8px" onclick="openWrong('${key(q)}')">この問題を開く</button></div>`).join("")
}
function openWrong(k){pool=ALL.filter(q=>wrongKeys.has(key(q)));index=pool.findIndex(q=>key(q)===k);if(index<0)index=0;renderQuestion();showView("quizView")}
function renderStats(){
 el("statsSummary").textContent=`正解 ${correct} / ${attempts}（正答率 ${attempts?Math.round(correct/attempts*100):"--"}%）`;
 el("statsSettings").textContent=`年度：${el("year").value||"全年度"} / 分野：${el("category").value||"全分野"} / 小テーマ：${el("theme").value||"全小テーマ"} / ランダム：${randomMode?"ON":"OFF"}`;
 el("statsWrong").textContent=`${wrongKeys.size}問`;
}
function updateStats(){el("poolStat").textContent=`出題候補 ${pool.length||filtered().length}問`;el("scoreStat").textContent=`正解 ${correct} / ${attempts}`;el("rateStat").textContent=`正答率 ${attempts?Math.round(correct/attempts*100):"--"}%`;el("bar").style.width=`${pool.length?((index+1)/pool.length*100):0}%`}
function updateRandom(){const b=el("randomBtn");b.textContent=randomMode?"🔀 ランダム ON":"🔀 ランダム OFF";b.classList.toggle("toggle-on",randomMode);b.setAttribute("aria-pressed",randomMode?"true":"false")}
function save(){localStorage.setItem("metalHeatQuiz",JSON.stringify({correct,attempts,wrong:[...wrongKeys],randomMode,filters:{year:el("year").value,category:el("category").value,theme:el("theme").value}}))}
function load(){try{const s=JSON.parse(localStorage.getItem("metalHeatQuiz")||"{}");correct=s.correct||0;attempts=s.attempts||0;wrongKeys=new Set(s.wrong||[]);randomMode=!!s.randomMode;if(s.filters?.year)el("year").value=s.filters.year;refresh();if(s.filters?.category)el("category").value=s.filters.category;refresh();if(s.filters?.theme)el("theme").value=s.filters.theme}catch(e){}}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>showView(b.dataset.view));
["year","category"].forEach(id=>el(id).onchange=()=>{refresh();save()});el("theme").onchange=()=>{updateStats();save()};
el("randomBtn").onclick=()=>{randomMode=!randomMode;updateRandom();save()};el("startBtn").onclick=()=>start();el("wrongBtn").onclick=()=>start("wrong");
el("resetBtn").onclick=()=>{correct=0;attempts=0;wrongKeys.clear();save();updateStats();renderWrong();renderStats()};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;el("installBanner").classList.add("show")});
el("installBtn").onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;el("installBanner").classList.remove("show")}else{alert("iPhoneではSafariの共有メニューから『ホーム画面に追加』を選んでください。")}};
el("hideInstall").onclick=()=>el("installBanner").classList.remove("show");
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}))}
refresh();load();refresh();updateRandom();updateStats();showView("homeView");
</script>
</body></html>
